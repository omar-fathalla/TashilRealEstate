# TAQ-33: every PR into dev or master runs the same checks we run locally before merging.
name: CI

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend, rules and emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
      - run: npm install -g firebase-tools@15
      - name: No high or critical advisories
        run: npm audit --audit-level=high
      - name: No Gemini keys or direct Gemini calls in the client sources
        run: npm run check:client-keys
      - name: Unit, rules and emulator smoke tests (demo project, no credentials)
        run: npm test

  frontend:
    name: Flutter analyze, test and prod web build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true
      - working-directory: frontend
        run: flutter pub get
      - working-directory: frontend
        run: flutter analyze
      - working-directory: frontend
        run: flutter test
      - name: Prod web build carries no dev config
        working-directory: frontend
        run: |
          tool/build_web.sh --release
          if grep -q tashil-aqar-dev build/web/main.dart.js; then
            echo "The prod bundle contains the dev Firebase project (TAQ-81)." >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: No AI keys in the built web app
        working-directory: backend
        run: npm ci --no-audit --no-fund && npm run check:client-keys:build

  secrets:
    name: Secret scan of the PR's commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
