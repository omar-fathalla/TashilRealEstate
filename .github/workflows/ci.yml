name: CI

on:
  pull_request:
  push:
    branches: [mac-local-work]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Analyze and test
        working-directory: frontend
        run: |
          flutter pub get
          flutter analyze
          flutter test

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Check functions
        working-directory: backend
        run: |
          npm ci
          npm audit --audit-level=critical
          node --check index.js
          node --check seed.js
          node --check seed_emulator.js
          node --check gemini_proxy.js
          node --check authz.js
